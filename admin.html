<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
  :root{--bg:#0a0a0b;--card:#141416;--border:#26262a;--text:#f2f2f3;--muted:#9a9aa2;--accent:#c8f04e;--err:#ff6b6b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:22px;margin-bottom:18px}
  input,textarea,select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px 14px;font-size:15px;margin-bottom:12px}
  textarea{min-height:200px;font-family:ui-monospace,monospace;font-size:13px;resize:vertical}
  button{background:var(--accent);color:#000;border:none;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px;word-break:break-all}
  .item .acts{display:flex;gap:8px;flex-shrink:0}
  .item button{width:auto;padding:7px 14px;font-size:13px}
  .msg{font-size:13px;margin:10px 0;min-height:16px}
  .ok{color:var(--accent)}.bad{color:var(--err)}
  .hidden{display:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .top button{width:auto;padding:8px 16px;font-size:13px;background:transparent;color:var(--muted);border:1px solid var(--border)}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <!-- LOGIN -->
  <div id="loginView">
    <h1>🔒 Admin Login</h1>
    <label>GitHub username</label>
    <input id="lUser" placeholder="papeiizu" value="papel-lizu">
    <label>Repository name</label>
    <input id="lRepo" placeholder="My-Portfolio" value="My-Portfolio">
    <label>GitHub token (fine-grained, contents read+write)</label>
    <input id="lToken" type="password" placeholder="github_pat_...">
    <button onclick="login()">Login</button>
    <div class="msg" id="lMsg"></div>
  </div>

  <!-- PANEL -->
  <div id="panelView" class="hidden">
    <div class="top">
      <h1 style="margin:0">⚙️ <span id="repoName"></span></h1>
      <button onclick="logout()">Logout</button>
    </div>
    <button onclick="loadFiles()" class="ghost" style="margin-bottom:14px">↻ Refresh files</button>
    <div id="fileList"></div>
    <div class="msg" id="pMsg"></div>
  </div>

  <!-- EDITOR -->
  <div id="editView" class="hidden">
    <h1 id="editTitle"></h1>
    <textarea id="editBody" spellcheck="false"></textarea>
    <div class="row">
      <button class="ghost" onclick="show('panelView')">Cancel</button>
      <button onclick="saveFile()">💾 Save &amp; Deploy</button>
    </div>
    <div class="msg" id="eMsg"></div>
  </div>

  <!-- UPLOAD -->
  <div id="upView" class="hidden">
    <h1>⬆️ Upload file</h1>
    <label>Folder (e.g. pics, apps, or empty for root)</label>
    <input id="upPath" placeholder="pics/">
    <input type="file" id="upFile">
    <div class="row">
      <button class="ghost" onclick="show('panelView')">Cancel</button>
      <button onclick="uploadFile()">Upload</button>
    </div>
    <div class="msg" id="uMsg"></div>
  </div>
</div>

<script>
let USER="",REPO="",TOKEN="";
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return window._mem&&window._mem[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){(window._mem=window._mem||{})[k]=v}},del:k=>{try{localStorage.removeItem(k)}catch(e){if(window._mem)delete window._mem[k]}}};
const API="https://api.github.com";
const $=id=>document.getElementById(id);

function show(id){["loginView","panelView","editView","upView"].forEach(v=>$(v).classList.toggle("hidden",v!==id));}
function msg(id,text,bad){const e=$(id);e.textContent=text;e.className="msg "+(bad?"bad":"ok");}

window.onerror=function(m){document.querySelectorAll(".msg").forEach(e=>e.textContent="Error: "+m);return false};
function login(){
  USER=$("lUser").value.trim();REPO=$("lRepo").value.trim();TOKEN=$("lToken").value.trim();
  if(!TOKEN){msg("lMsg","token dite hobe",true);return;}
  store.set("gh_admin",JSON.stringify({USER,REPO,TOKEN}));
  loadFiles();
}
function logout(){store.del("gh_admin");show("loginView");}

function hdr(){return {"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json"};}

async function loadFiles(){
  msg("pMsg","loading...");
  try{
    const r=await fetch(`${API}/repos/${USER}/${REPO}/contents/`,{headers:hdr()});
    if(r.status===401||r.status===403){msg("pMsg","token bhul ba permission nei",true);return;}
    if(!r.ok){msg("pMsg","repo pawa jay ni: "+r.status,true);return;}
    const files=await r.json();
    $("repoName").textContent=USER+"/"+REPO;
    $("fileList").innerHTML=files.filter(f=>f.name!=="admin.html").map(f=>`
      <div class="item">
        <span>${f.type==="dir"?"📁":"📄"} ${f.name}</span>
        <span class="acts">
          ${f.type==="file"?`<button onclick="openFile('${f.path}')">Edit</button>`:""}
          <button class="ghost" onclick="delFile('${f.path}',this)">Del</button>
        </span>
      </div>`).join("")
      +`<button class="ghost" style="margin-top:10px" onclick="show('upView')">+ Notun file / pic / APK upload</button>`;
    show("panelView");msg("pMsg","");
  }catch(e){msg("pMsg","network error: "+e.message,true);}
}

async function openFile(path){
  msg("pMsg","loading "+path+"...");
  const r=await fetch(`${API}/repos/${USER}/${REPO}/contents/${path}`,{headers:hdr()});
  const j=await r.json();
  window._cur={path,sha:j.sha};
  $("editTitle").textContent=path;
  $("editBody").value=decodeURIComponent(escape(atob(j.content.replace(/\s/g,""))));
  show("editView");msg("pMsg","");
}

async function saveFile(){
  msg("eMsg","saving...");
  const content=btoa(unescape(encodeURIComponent($("editBody").value)));
  const r=await fetch(`${API}/repos/${USER}/${REPO}/contents/${window._cur.path}`,{
    method:"PUT",headers:hdr(),
    body:JSON.stringify({message:"update "+window._cur.path+" via admin",content,sha:window._cur.sha})
  });
  if(r.ok){msg("eMsg","saved ✅ Vercel e deploy hocche, 1-2 min e live");setTimeout(()=>loadFiles(),1500);}
  else msg("eMsg","save failed: "+r.status,true);
}

async function delFile(path,btn){
  if(!confirm("Delete "+path+"?"))return;
  btn.textContent="...";
  const g=await fetch(`${API}/repos/${USER}/${REPO}/contents/${path}`,{headers:hdr()});
  const j=await g.json();
  const r=await fetch(`${API}/repos/${USER}/${REPO}/contents/${path}`,{
    method:"DELETE",headers:hdr(),
    body:JSON.stringify({message:"delete "+path+" via admin",sha:j.sha})
  });
  if(r.ok){msg("pMsg","deleted ✅");loadFiles();}
  else{msg("pMsg","delete failed: "+r.status,true);btn.textContent="Del";}
}

async function uploadFile(){
  const f=$("upFile").files[0];
  if(!f){msg("uMsg","file select koro",true);return;}
  let folder=$("upPath").value.trim().replace(/^\/|\/$/g,"");
  const path=(folder?folder+"/":"")+f.name;
  msg("uMsg","uploading "+path+"...");
  const reader=new FileReader();
  reader.onload=async()=>{
    const content=reader.result.split(",")[1];
    const r=await fetch(`${API}/repos/${USER}/${REPO}/contents/${path}`,{
      method:"PUT",headers:hdr(),
      body:JSON.stringify({message:"upload "+path+" via admin",content})
    });
    if(r.ok){msg("uMsg","uploaded ✅");setTimeout(()=>{show("panelView");loadFiles();},1200);}
    else msg("uMsg","upload failed: "+r.status,true);
  };
  reader.readAsDataURL(f);
}

// auto login if saved
try{const s=JSON.parse(store.get("gh_admin"));if(s&&s.TOKEN){USER=s.USER;REPO=s.REPO;TOKEN=s.TOKEN;loadFiles();}}catch(e){}
</script>
</body>
</html>
